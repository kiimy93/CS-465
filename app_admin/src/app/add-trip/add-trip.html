<div class="container mt-4">
  <div class="col-md-6 mx-auto">
    <h2 class="text-center mb-4">Add Trip</h2>

    <form *ngIf="addForm" [formGroup]="addForm" (ngSubmit)="onSubmit()">
      <div class="form-group mb-3">
        <label>Code:</label>
        <input
          type="text"
          formControlName="code"
          placeholder="Code"
          class="form-control"
          [ngClass]="{ 'is-invalid': submitted && f['code'].errors }"
        />
      </div>

      <div class="form-group mb-3">
        <label>Name:</label>
        <input
          type="text"
          formControlName="name"
          placeholder="Name"
          class="form-control"
          [ngClass]="{ 'is-invalid': submitted && f['name'].errors }"
        />
      </div>

      <div class="form-group mb-3">
        <label>Length:</label>
        <input
          type="text"
          formControlName="length"
          placeholder="Length"
          class="form-control"
          [ngClass]="{ 'is-invalid': submitted && f['length'].errors }"
        />
      </div>

      <div class="form-group mb-3">
        <label>Start:</label>
        <input
          type="date"
          formControlName="start"
          class="form-control"
          [ngClass]="{ 'is-invalid': submitted && f['start'].errors }"
        />
      </div>

      <div class="form-group mb-3">
        <label>Resort:</label>
        <input
          type="text"
          formControlName="resort"
          placeholder="Resort"
          class="form-control"
          [ngClass]="{ 'is-invalid': submitted && f['resort'].errors }"
        />
      </div>

      <div class="form-group mb-3">
        <label>Per Person:</label>
        <input
          type="text"
          formControlName="perPerson"
          placeholder="Per Person"
          class="form-control"
          [ngClass]="{ 'is-invalid': submitted && f['perPerson'].errors }"
        />
      </div>

      <div class="form-group mb-3">
        <label>Image Name:</label>
        <input
          type="text"
          formControlName="image"
          placeholder="reef1.jpg"
          class="form-control"
          [ngClass]="{ 'is-invalid': submitted && f['image'].errors }"
        />
      </div>

      <div class="form-group mb-3">
        <label>Description:</label>
        <textarea
          formControlName="description"
          placeholder="Description"
          class="form-control"
          rows="4"
          [ngClass]="{ 'is-invalid': submitted && f['description'].errors }"
        ></textarea>
      </div>

      <button type="submit" class="btn btn-info">Save</button>
    </form>
  </div>
</div>
