<div class="container">
  <h2>Login</h2>

  <form (ngSubmit)="onSubmit()">
    <div>
      <label>Name</label>
      <input [(ngModel)]="credentials.name" name="name" required />
    </div>

    <div>
      <label>Email</label>
      <input [(ngModel)]="credentials.email" name="email" required />
    </div>

    <div>
      <label>Password</label>
      <input [(ngModel)]="credentials.password" name="password" type="password" required />
    </div>

    <button type="submit">Login</button>
  </form>
</div>
